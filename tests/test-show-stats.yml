name: Test show_stats option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/valid
          config_file: .linkspector.yml
          reporter: local
          fail_level: none
          filter_mode: nofilter
          show_stats: "true"
        continue-on-error: true

      - name: Assert action completed with stats
        run: |
          echo "Action completed with show_stats=true"
          echo "PASS"
