name: Test show_stats feature
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          config_file: tests/fixtures/linkspector-stats/.linkspector.yml
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          show_stats: "true"
        continue-on-error: true

      - name: Assert action ran (show_stats enabled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with show_stats=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (may be due to sentinel repo or link check result)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
