name: Test fail_on_error option with valid links
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/valid
          config_file: .linkspector.yml
          reporter: local
          fail_on_error: "true"
          filter_mode: nofilter
        continue-on-error: true

      - name: Assert action completed successfully with fail_on_error=true and valid links
        run: |
          echo "Action completed successfully with fail_on_error=true and no broken links"
          echo "PASS"
